name: Bug report
description: Report a reproducible correctness or reliability problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private keys, private wallet data, or other secrets.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe command sequence or fixture that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Execution mode
      options:
        - Paper
        - Dry run
        - Live pilot
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add sanitized logs, tracebacks, or screenshots. Remove secrets and private wallet information.
